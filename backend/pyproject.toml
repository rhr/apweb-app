[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apw"
version = "0.2.0"
description = "Knowledge store for angiosperm phylogeny, with provenance and literature links"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apw = "apw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apw = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
