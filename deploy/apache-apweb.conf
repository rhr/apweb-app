# Apache: serve the app at https://<host>/apweb/ by proxying to uvicorn on :8010.
# Paste inside the <VirtualHost *:443> block for the host (needs mod_proxy, mod_proxy_http,
# mod_headers), then: sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The frontend must be built for this prefix: cd frontend && npm run build -- --base=/apweb/

RedirectMatch ^/apweb$ /apweb/

<Location "/apweb/">
    # flushpackets: pass the Ask page's Server-Sent Events through as they arrive.
    # timeout: an Ask answer can take a few minutes.
    ProxyPass        http://127.0.0.1:8010/ flushpackets=on timeout=600
    ProxyPassReverse http://127.0.0.1:8010/
    RequestHeader set X-Forwarded-Proto "https"
</Location>
